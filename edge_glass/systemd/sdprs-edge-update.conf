# SDPRS edge auto-update config — sourced by /opt/sdprs/edge_autoupdate.sh.
# Installer copies this to /etc/sdprs-edge-update.conf (only if absent, so
# per-node edits survive re-bootstrap). Tunable without touching the script.
REPO="https://github.com/Thomas-Tai/sdprs"
BRANCH="edge-release"
DEST="/opt/sdprs/edge_glass"
SVC="sdprs-edge-cloud"
STATE_DIR="/opt/sdprs"
RUN_DIR="/run/sdprs"
QUIET_START="03:00"
QUIET_END="05:00"
HEALTH_TIMEOUT="60"
HEALTH_INTERVAL="3"
KEEP_SNAPSHOTS="3"
# Max age (seconds) of a "1" in update_hold before it's treated as stale (dead
# edge writer) and no longer defers a scheduled update. Should be >> heartbeat.
HOLD_MAX_AGE="300"
EDGE_READY_FILE="/run/sdprs/edge_ready"
REQUIRE_EDGE_READY="1"
OWNER="sdprs:sdprs"
